<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <defs>
    <style>
      text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a1a1a; }
      .uc-ellipse { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; }
      .actor-line { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
      .assoc { stroke: #1a1a1a; stroke-width: 1.3; }
      .boundary { fill: none; stroke: #1a1a1a; stroke-width: 1.6; }
      .label { font-size: 15px; }
      .actor-label { font-size: 15px; font-weight: 600; }
      .system-label { font-size: 16px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

  <!-- システム境界 -->
  <rect x="250" y="40" width="420" height="490" class="boundary"/>
  <text x="460" y="68" text-anchor="middle" class="system-label">図書館アプリ</text>

  <!-- アクター: 利用者 -->
  <g>
    <circle cx="100" cy="150" r="16" class="actor-line"/>
    <line x1="100" y1="166" x2="100" y2="215" class="actor-line"/>
    <line x1="72" y1="182" x2="128" y2="182" class="actor-line"/>
    <line x1="100" y1="215" x2="76" y2="252" class="actor-line"/>
    <line x1="100" y1="215" x2="124" y2="252" class="actor-line"/>
    <text x="100" y="278" text-anchor="middle" class="actor-label">利用者</text>
  </g>

  <!-- アクター: 司書 -->
  <g>
    <circle cx="820" cy="330" r="16" class="actor-line"/>
    <line x1="820" y1="346" x2="820" y2="395" class="actor-line"/>
    <line x1="792" y1="362" x2="848" y2="362" class="actor-line"/>
    <line x1="820" y1="395" x2="796" y2="432" class="actor-line"/>
    <line x1="820" y1="395" x2="844" y2="432" class="actor-line"/>
    <text x="820" y="458" text-anchor="middle" class="actor-label">司書</text>
  </g>

  <!-- ユースケース -->
  <ellipse cx="460" cy="110" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="115" text-anchor="middle" class="label">本を検索する</text>

  <ellipse cx="460" cy="190" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="195" text-anchor="middle" class="label">本を予約する</text>

  <ellipse cx="460" cy="270" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="275" text-anchor="middle" class="label">予約を取り消す</text>

  <ellipse cx="460" cy="360" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="365" text-anchor="middle" class="label">貸出を記録する</text>

  <ellipse cx="460" cy="450" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="455" text-anchor="middle" class="label">蔵書を登録する</text>

  <!-- 関連線: 利用者 -->
  <line x1="128" y1="160" x2="340" y2="115" class="assoc"/>
  <line x1="132" y1="185" x2="340" y2="190" class="assoc"/>
  <line x1="130" y1="210" x2="340" y2="263" class="assoc"/>

  <!-- 関連線: 司書 -->
  <line x1="792" y1="340" x2="580" y2="362" class="assoc"/>
  <line x1="792" y1="355" x2="580" y2="443" class="assoc"/>
</svg>
