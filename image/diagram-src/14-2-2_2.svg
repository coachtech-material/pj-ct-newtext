<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520">
  <defs>
    <style>
      text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a1a1a; }
      .uc-ellipse { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; }
      .actor-line { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
      .assoc { stroke: #1a1a1a; stroke-width: 1.3; }
      .boundary { fill: none; stroke: #1a1a1a; stroke-width: 1.6; }
      .label { font-size: 15px; }
      .actor-label { font-size: 15px; font-weight: 600; }
      .system-label { font-size: 16px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <!-- システム境界 -->
  <rect x="280" y="30" width="440" height="460" class="boundary"/>
  <text x="500" y="58" text-anchor="middle" class="system-label">ブログシステム</text>

  <!-- アクター: ユーザー -->
  <g>
    <circle cx="110" cy="210" r="16" class="actor-line"/>
    <line x1="110" y1="226" x2="110" y2="275" class="actor-line"/>
    <line x1="82" y1="242" x2="138" y2="242" class="actor-line"/>
    <line x1="110" y1="275" x2="86" y2="312" class="actor-line"/>
    <line x1="110" y1="275" x2="134" y2="312" class="actor-line"/>
    <text x="110" y="338" text-anchor="middle" class="actor-label">ユーザー</text>
  </g>

  <!-- ユースケース -->
  <ellipse cx="500" cy="110" rx="140" ry="30" class="uc-ellipse"/>
  <text x="500" y="115" text-anchor="middle" class="label">投稿の一覧を見る</text>

  <ellipse cx="500" cy="200" rx="140" ry="30" class="uc-ellipse"/>
  <text x="500" y="205" text-anchor="middle" class="label">新しい投稿を作成する</text>

  <ellipse cx="500" cy="290" rx="140" ry="30" class="uc-ellipse"/>
  <text x="500" y="295" text-anchor="middle" class="label">投稿を編集する</text>

  <ellipse cx="500" cy="380" rx="140" ry="30" class="uc-ellipse"/>
  <text x="500" y="385" text-anchor="middle" class="label">投稿を削除する</text>

  <!-- 関連線 -->
  <line x1="138" y1="222" x2="360" y2="122" class="assoc"/>
  <line x1="142" y1="240" x2="360" y2="203" class="assoc"/>
  <line x1="142" y1="255" x2="360" y2="287" class="assoc"/>
  <line x1="138" y1="272" x2="360" y2="371" class="assoc"/>
</svg>
