<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620">
  <defs>
    <style>
      text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a1a1a; }
      .uc-ellipse { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; }
      .actor-line { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
      .assoc { stroke: #1a1a1a; stroke-width: 1.3; }
      .boundary { fill: none; stroke: #1a1a1a; stroke-width: 1.6; }
      .label { font-size: 15px; }
      .actor-label { font-size: 15px; font-weight: 600; }
      .system-label { font-size: 16px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>

  <!-- システム境界 -->
  <rect x="240" y="50" width="440" height="520" class="boundary"/>
  <text x="460" y="80" text-anchor="middle" class="system-label">経費精算アプリ</text>

  <!-- アクター: 申請者 -->
  <g>
    <circle cx="95" cy="190" r="16" class="actor-line"/>
    <line x1="95" y1="206" x2="95" y2="255" class="actor-line"/>
    <line x1="67" y1="222" x2="123" y2="222" class="actor-line"/>
    <line x1="95" y1="255" x2="71" y2="292" class="actor-line"/>
    <line x1="95" y1="255" x2="119" y2="292" class="actor-line"/>
    <text x="95" y="318" text-anchor="middle" class="actor-label">申請者</text>
  </g>

  <!-- アクター: 承認者 -->
  <g>
    <circle cx="810" cy="330" r="16" class="actor-line"/>
    <line x1="810" y1="346" x2="810" y2="395" class="actor-line"/>
    <line x1="782" y1="362" x2="838" y2="362" class="actor-line"/>
    <line x1="810" y1="395" x2="786" y2="432" class="actor-line"/>
    <line x1="810" y1="395" x2="834" y2="432" class="actor-line"/>
    <text x="810" y="458" text-anchor="middle" class="actor-label">承認者</text>
  </g>

  <!-- ユースケース -->
  <ellipse cx="460" cy="140" rx="130" ry="30" class="uc-ellipse"/>
  <text x="460" y="145" text-anchor="middle" class="label">経費を申請する</text>

  <ellipse cx="460" cy="230" rx="130" ry="30" class="uc-ellipse"/>
  <text x="460" y="235" text-anchor="middle" class="label">申請状況を確認する</text>

  <ellipse cx="460" cy="320" rx="130" ry="30" class="uc-ellipse"/>
  <text x="460" y="325" text-anchor="middle" class="label">申請を承認する</text>

  <ellipse cx="460" cy="410" rx="130" ry="30" class="uc-ellipse"/>
  <text x="460" y="415" text-anchor="middle" class="label">申請を差し戻す</text>

  <ellipse cx="460" cy="500" rx="130" ry="30" class="uc-ellipse"/>
  <text x="460" y="505" text-anchor="middle" class="label">差し戻された申請を出し直す</text>

  <!-- 関連線: 申請者 -->
  <line x1="123" y1="200" x2="335" y2="148" class="assoc"/>
  <line x1="126" y1="222" x2="332" y2="228" class="assoc"/>
  <line x1="118" y1="250" x2="340" y2="488" class="assoc"/>

  <!-- 関連線: 承認者 -->
  <line x1="782" y1="352" x2="585" y2="152" class="assoc"/>
  <line x1="782" y1="356" x2="588" y2="238" class="assoc"/>
  <line x1="782" y1="360" x2="590" y2="322" class="assoc"/>
  <line x1="782" y1="366" x2="588" y2="404" class="assoc"/>
  <line x1="782" y1="372" x2="583" y2="486" class="assoc"/>
</svg>
