<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <defs>
    <style>
      text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a1a1a; }
      .uc-ellipse { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; }
      .actor-line { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
      .assoc { stroke: #1a1a1a; stroke-width: 1.3; }
      .boundary { fill: none; stroke: #1a1a1a; stroke-width: 1.6; }
      .label { font-size: 15px; }
      .actor-label { font-size: 15px; font-weight: 600; }
      .system-label { font-size: 16px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

  <!-- システム境界 -->
  <rect x="250" y="40" width="420" height="490" class="boundary"/>
  <text x="460" y="68" text-anchor="middle" class="system-label">モバイルオーダーアプリ</text>

  <!-- アクター: お客さま -->
  <g>
    <circle cx="100" cy="150" r="16" class="actor-line"/>
    <line x1="100" y1="166" x2="100" y2="215" class="actor-line"/>
    <line x1="72" y1="182" x2="128" y2="182" class="actor-line"/>
    <line x1="100" y1="215" x2="76" y2="252" class="actor-line"/>
    <line x1="100" y1="215" x2="124" y2="252" class="actor-line"/>
    <text x="100" y="278" text-anchor="middle" class="actor-label">お客さま</text>
  </g>

  <!-- アクター: 店員 -->
  <g>
    <circle cx="820" cy="360" r="16" class="actor-line"/>
    <line x1="820" y1="376" x2="820" y2="425" class="actor-line"/>
    <line x1="792" y1="392" x2="848" y2="392" class="actor-line"/>
    <line x1="820" y1="425" x2="796" y2="462" class="actor-line"/>
    <line x1="820" y1="425" x2="844" y2="462" class="actor-line"/>
    <text x="820" y="488" text-anchor="middle" class="actor-label">店員</text>
  </g>

  <!-- ユースケース -->
  <ellipse cx="460" cy="110" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="115" text-anchor="middle" class="label">メニューを見る</text>

  <ellipse cx="460" cy="190" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="195" text-anchor="middle" class="label">商品を注文する</text>

  <ellipse cx="460" cy="270" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="275" text-anchor="middle" class="label">注文状況を確認する</text>

  <ellipse cx="460" cy="350" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="355" text-anchor="middle" class="label">注文を取り消す</text>

  <ellipse cx="460" cy="460" rx="120" ry="30" class="uc-ellipse"/>
  <text x="460" y="465" text-anchor="middle" class="label">注文を受け渡す</text>

  <!-- 関連線: お客さま -->
  <line x1="128" y1="160" x2="340" y2="115" class="assoc"/>
  <line x1="132" y1="182" x2="340" y2="190" class="assoc"/>
  <line x1="132" y1="200" x2="340" y2="265" class="assoc"/>
  <line x1="130" y1="212" x2="348" y2="340" class="assoc"/>

  <!-- 関連線: 店員 -->
  <line x1="792" y1="380" x2="580" y2="452" class="assoc"/>
</svg>
